name: Build GaragePOS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode GaragePOS
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Periksa versi Flutter
        run: flutter --version

      - name: Ambil kebutuhan aplikasi
        run: flutter pub get

      - name: Buat APK Android
        run: flutter build apk --debug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: GaragePOS-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
